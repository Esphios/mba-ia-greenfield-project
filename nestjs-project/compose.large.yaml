services:
  nestjs-api-test:
    command: ["sh", "-c", "npm run build && npm run start:prod"]
    environment:
      S3_PUBLIC_ENDPOINT: http://minio-test:9000
      NODE_OPTIONS: --require=/home/node/app/test/support/video-event-loop-monitor.cjs

  video-worker-test:
    cpus: 2.0
    mem_limit: 1g
    environment:
      S3_PUBLIC_ENDPOINT: http://minio-test:9000

  minio-test:
    tmpfs: !reset []
    volumes:
      - large-minio-data:/data

  large-client:
    profiles: [large]
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["node", "test/support/video-large-client.cjs"]
    working_dir: /home/node/app
    volumes:
      - .:/home/node/app
      - test-node-modules:/home/node/app/node_modules
      - large-fixtures:/work/fixtures
    environment:
      NODE_ENV: test
      DB_HOST: db-test
      DB_PORT: "5432"
      DB_USERNAME: streamtube_phase03_test
      DB_PASSWORD: streamtube_phase03_test
      DB_NAME: streamtube_phase03_test
      DB_DATABASE: streamtube_phase03_test
      S3_PUBLIC_ENDPOINT: http://minio-test:9000
      VIDEO_LARGE_API_URL: http://nestjs-api-test:3000
      VIDEO_LARGE_FIXTURE_DIR: /work/fixtures
    depends_on:
      nestjs-api-test:
        condition: service_started
      minio-test:
        condition: service_healthy

  large-probe:
    extends:
      service: large-client
    command: ["node", "test/support/video-large-probe.cjs"]

volumes:
  large-minio-data:
  large-fixtures:
